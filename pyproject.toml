[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-arbitration"
version = "0.1.0"
description = "Fan out prompts to multiple LLMs and synthesize a single merged answer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.3.0"]

[project.scripts]
arbitrate = "llm_arbitration.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_arbitration"]

[tool.hatch.build.targets.wheel.sources]
"src/llm_arbitration" = "llm_arbitration"
